apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: petclinic-ingress
  namespace: {{ .Values.namespace }}

spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: petclinic
                port:
                  number: {{ .Values.service.port }}