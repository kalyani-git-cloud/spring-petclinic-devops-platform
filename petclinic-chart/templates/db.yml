apiVersion: v1
kind: Secret

metadata:
  name: demo-db
  namespace: {{ .Release.Namespace }}

type: Opaque

stringData:
  MYSQL_ROOT_PASSWORD: rootpass
  MYSQL_DATABASE: petclinic
  MYSQL_USER: petclinic
  MYSQL_PASSWORD: petclinic

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: demo-db
  namespace: {{ .Release.Namespace }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: demo-db

  template:
    metadata:
      labels:
        app: demo-db

    spec:
      containers:
      - name: mysql
        image: mysql:8.0

        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-db
              key: MYSQL_ROOT_PASSWORD

        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: demo-db
              key: MYSQL_DATABASE

        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: demo-db
              key: MYSQL_USER

        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-db
              key: MYSQL_PASSWORD

        ports:
        - containerPort: 3306

---
apiVersion: v1
kind: Service

metadata:
  name: demo-db
  namespace: {{ .Release.Namespace }}

spec:
  selector:
    app: demo-db

  ports:
    - port: 3306
      targetPort: 3306