apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: spring-petclinic
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/kalyani-git-cloud/spring-petclinic-devops-platform.git
    targetRevision: feature/centralized-logging
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true