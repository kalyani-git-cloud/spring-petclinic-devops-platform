trigger:
  branches:
    include:
      - feature/helm

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: SONAR-CONFIG

- name: JAVA_VERSION
  value: '21'

- name: imageRepository
  value: 'spring-petclinic'

- name: dockerfilePath
  value: 'Dockerfile'

- name: imageTag
  value: '$(Build.BuildId)'

stages:

#=====================================================
# Stage 1 - Build & Scan
#=====================================================

- stage: Build
  displayName: 'Build and Scan'

  jobs:
  - job: Build
    displayName: 'Build Job'

    steps:

    # Checkout Source
    - checkout: self

    # Install Java
    - task: JavaToolInstaller@0
      displayName: 'Install Java 21'
      inputs:
        versionSpec: '$(JAVA_VERSION)'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    #=====================================================
    # SonarCloud (Temporarily Disabled)
    #=====================================================

    # - task: SonarCloudPrepare@3
    #   displayName: 'Prepare SonarCloud Analysis'
    #   inputs:
    #     SonarCloud: 'new-connection'
    #     organization: '$(SONAR_ORG)'
    #     scannerMode: 'other'
    #     extraProperties: |
    #       sonar.projectKey=$(SONAR_PROJECT)
    #       sonar.organization=$(SONAR_ORG)

    # Build & Test
    - task: Maven@4
      displayName: 'Build and Test'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean verify'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.21'
        mavenVersionOption: 'Default'

    # - task: SonarCloudPublish@3
    #   displayName: 'Publish SonarCloud Quality Gate'
    #   inputs:
    #     pollingTimeoutSec: '300'

    #=====================================================
    # Publish Build Artifact
    #=====================================================

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifact'
      inputs:
        PathtoPublish: 'target'
        ArtifactName: 'petclinic'
        publishLocation: 'Container'

    #=====================================================
    # Build Docker Image
    #=====================================================

    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: build
        containerRegistry: 'acr-docker-connection'
        repository: '$(imageRepository)'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(imageTag)
          latest

    #=====================================================
    # Install Trivy
    #=====================================================

    - script: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
        trivy --version
      displayName: 'Install Trivy'

    #=====================================================
    # Save Docker Image
    #=====================================================

    - script: |
        IMAGE_NAME=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep ":$(imageTag)$" | head -n 1)

        echo "Image: $IMAGE_NAME"

        docker save "$IMAGE_NAME" -o spring-petclinic.tar
      displayName: 'Save Docker Image'

    #=====================================================
    # Scan Docker Image
    #=====================================================

    - script: |
        trivy image \
          --input spring-petclinic.tar \
          --exit-code 0 \
          --severity HIGH,CRITICAL
      displayName: 'Scan Docker Image'

    #=====================================================
    # Push Docker Image
    #=====================================================

    - task: Docker@2
      displayName: 'Push Docker Image'
      inputs:
        command: push
        containerRegistry: 'acr-docker-connection'
        repository: '$(imageRepository)'
        tags: |
          $(imageTag)
          latest

#=====================================================
# Stage 2 - Validate Helm & Deploy to AKS
#=====================================================

- stage: Deploy
  displayName: 'Validate Helm and Deploy to AKS'
  dependsOn: Build
  condition: succeeded()

  jobs:

  - deployment: DeployAKS
    displayName: 'Deploy PetClinic'
    environment: 'aks'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          #=====================================================
          # Install Helm
          #=====================================================

          - task: HelmInstaller@1
            displayName: 'Install Helm'
            inputs:
              helmVersionToInstall: 'latest'

          #=====================================================
          # Validate Helm Chart
          #=====================================================

          - script: |
              helm lint petclinic-chart
            displayName: 'Helm Lint'

          #=====================================================
          # Render Helm Templates
          #=====================================================

          - script: |
              helm template petclinic petclinic-chart
            displayName: 'Helm Template'

          #=====================================================
          # Deploy using Kubernetes Manifests
          #=====================================================

          - task: KubernetesManifest@1
            displayName: 'Deploy PetClinic Resources'
            inputs:
              action: deploy
              kubernetesServiceConnection: 'aks-kubernetes-connection'
              namespace: 'petclinic'
              manifests: |
                k8s/configmap.yaml
                k8s/secret.yaml
                k8s/db.yml
                k8s/deployment.yaml
                k8s/service.yaml
                k8s/ingress.yaml
#=====================================================
# Stage 3 - Terraform Validation
#=====================================================

- stage: Terraform
  displayName: 'Terraform Validation'
  dependsOn: Deploy
  condition: succeeded()

  jobs:

  - job: TerraformValidation
    displayName: 'Terraform Init and Validate'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    # Checkout Source
    - checkout: self

    #=====================================================
    # Install Terraform
    #=====================================================

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    #=====================================================
    # Terraform Init
    #=====================================================

    - script: |
        cd terraform
        terraform init
      displayName: 'Terraform Init'

    #=====================================================
    # Terraform Validate
    #=====================================================

    - script: |
        cd terraform
        terraform validate
      displayName: 'Terraform Validate'

    #=====================================================
    # Terraform Plan
    # Uncomment after configuring Azure Service Connection
    #=====================================================

    # - script: |
    #     cd terraform
    #     terraform plan
    #   displayName: 'Terraform Plan'

    #=====================================================
    # Terraform Apply
    # Uncomment only after importing existing resources
    # or when using a new Azure subscription.
    #=====================================================

    # - script: |
    #     cd terraform
    #     terraform apply -auto-approve
    #   displayName: 'Terraform Apply'                