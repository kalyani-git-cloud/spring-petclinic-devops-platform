server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  - job_name: spring-petclinic

    static_configs:
      - targets:
          - localhost

        labels:
          job: petclinic
          host: local-machine
          __path__: /var/log/*.log