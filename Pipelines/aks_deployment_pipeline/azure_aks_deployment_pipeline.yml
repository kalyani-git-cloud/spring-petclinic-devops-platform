trigger:
  branches:
    include:
      - feature/centralized-logging

pool:
  vmImage: ubuntu-latest

variables:
- group: SONAR-CONFIG

- name: JAVA_VERSION
  value: '21'

- name: imageRepository
  value: 'spring-petclinic'

- name: imageTag
  value: '$(Build.BuildId)'

- name: acrName
  value: 'acrkalyani.azurecr.io'

# =====================================================
# BUILD STAGE
# =====================================================

stages:

- stage: Build
  displayName: Build and Scan

  jobs:
  - job: BuildJob
    displayName: Build Job

    steps:

    - checkout: self

    # Install Java
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '$(JAVA_VERSION)'
        jdkArchitectureOption: x64
        jdkSourceOption: PreInstalled

    # SonarCloud Prepare
    - task: SonarCloudPrepare@3
      displayName: Prepare SonarCloud
      inputs:
        SonarCloud: 'new-connection'
        organization: '$(SONAR_ORG)'
        scannerMode: 'other'
        extraProperties: |
          sonar.projectKey=$(SONAR_PROJECT)
          sonar.organization=$(SONAR_ORG)

    # Maven Build
    - task: Maven@4
      displayName: Build and Test
      inputs:
        mavenPomFile: pom.xml
        goals: clean verify
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: JDKVersion
        jdkVersionOption: '1.21'

    # Sonar Publish
    - task: SonarCloudPublish@3
      displayName: Publish Quality Gate
      inputs:
        pollingTimeoutSec: '300'

    # OWASP Dependency Check
    - script: |
        docker run --rm \
          -v $(System.DefaultWorkingDirectory):/src \
          owasp/dependency-check \
          --scan /src \
          --format HTML \
          --out /src/reports
      displayName: OWASP Dependency Check

    # Publish OWASP Report
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: reports
        ArtifactName: dependency-check-report

    # Docker Build
    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        containerRegistry: 'acr-docker-connection'
        repository: '$(imageRepository)'
        Dockerfile: Dockerfile
        tags: |
          $(imageTag)
          latest

    # Install Trivy
    - script: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
        trivy --version
      displayName: Install Trivy

    # Trivy Scan
    - script: |
        trivy image \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          --format table \
          $(acrName)/$(imageRepository):$(imageTag)
      displayName: Trivy Security Scan

    # Push Docker Image
    - task: Docker@2
      displayName: Push Docker Image
      inputs:
        command: push
        containerRegistry: 'acr-docker-connection'
        repository: '$(imageRepository)'
        tags: |
          $(imageTag)
          latest

# =====================================================
# DEPLOY STAGE
# =====================================================

- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Build
  condition: succeeded()

  jobs:

  - deployment: DeployAKS
    displayName: Deploy PetClinic
    environment: dev

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          # Replace image tag dynamically
          - script: |
              sed -i "s|IMAGE_TAG|$(imageTag)|g" k8s/deployment.yaml
            displayName: Update Image Tag

          # Deploy manifests
          - task: KubernetesManifest@1
            displayName: Deploy to AKS
            inputs:
              action: deploy
              kubernetesServiceConnection: aks-connection
              namespace: petclinic
              manifests: |
                k8s/configmap.yaml
                k8s/secret.yaml
                k8s/db.yml
                k8s/deployment.yaml
                k8s/service.yaml
                k8s/ingress.yaml

          # Verify Rollout
          - task: Kubernetes@1
            displayName: Verify Rollout
            inputs:
              connectionType: Kubernetes Service Connection
              kubernetesServiceEndpoint: aks-connection
              namespace: petclinic
              command: rollout
              arguments: status deployment/petclinic --timeout=300s

          # Get Service Details
          - task: Kubernetes@1
            displayName: Get Services
            inputs:
              connectionType: Kubernetes Service Connection
              kubernetesServiceEndpoint: aks-connection
              namespace: petclinic
              command: get
              arguments: svc

          # Debug on Failure
          - task: Kubernetes@1
            displayName: Describe Pod
            condition: failed()
            inputs:
              connectionType: Kubernetes Service Connection
              kubernetesServiceEndpoint: aks-connection
              namespace: petclinic
              command: get
              arguments: pods -o wide

          - task: Kubernetes@1
            displayName: Get Events
            condition: failed()
            inputs:
              connectionType: Kubernetes Service Connection
              kubernetesServiceEndpoint: aks-connection
              namespace: petclinic
              command: get
              arguments: events --sort-by=.metadata.creationTimestamp