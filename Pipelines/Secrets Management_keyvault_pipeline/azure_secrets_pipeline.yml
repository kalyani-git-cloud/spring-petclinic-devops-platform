trigger:
  branches:
    include:
      - develop

pool:
  vmImage: ubuntu-latest

stages:

- stage: SecretsValidation
  displayName: 'Secrets Management Validation'

  jobs:

  - job: ValidateSecrets
    displayName: 'Validate Key Vault Integration'

    steps:

    - checkout: self

    - script: |
        echo "Checking SecretProviderClass..."

        test -f security/secretproviderclass.yaml

        echo "SecretProviderClass found."
      displayName: 'Validate SecretProviderClass'

    - script: |
        echo "Displaying SecretProviderClass"

        cat security/secretproviderclass.yaml
      displayName: 'Display SecretProviderClass'

    - script: |
        echo "Checking Deployment Secret"

        test -f security/deployment-secret.yaml

        echo "Deployment Secret file found."
      displayName: 'Validate Deployment Secret'

    - script: |
        echo "Displaying Deployment Secret"

        cat security/deployment-secret.yaml
      displayName: 'Display Deployment Secret'

    - script: |
        grep "secretProviderClass" security/deployment-secret.yaml
      displayName: 'Verify Key Vault Mount'