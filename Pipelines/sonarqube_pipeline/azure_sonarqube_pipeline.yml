trigger:
  branches:
    include:
      - feature/sonarqube

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: SONAR-CONFIG

- name: JAVA_VERSION
  value: '21'

steps:

# Checkout Source Code
- checkout: self

# Install Java 21
- task: JavaToolInstaller@0
  displayName: 'Install Java 21'
  inputs:
    versionSpec: '$(JAVA_VERSION)'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

# Prepare SonarCloud Analysis
- task: SonarCloudPrepare@3
  displayName: 'Prepare SonarCloud Analysis'
  inputs:
    SonarCloud: 'new-connection'
    organization: '$(SONAR_ORG)'
    scannerMode: 'other'
    extraProperties: |
      sonar.projectKey=$(SONAR_PROJECT)
      sonar.organization=$(SONAR_ORG)

# Build and Test
- task: Maven@4
  displayName: 'Build and Test'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean verify'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.21'
    mavenVersionOption: 'Default'

# Run SonarCloud Analysis
- task: SonarCloudAnalyze@3
  displayName: 'Run SonarCloud Analysis'

# Publish Quality Gate
- task: SonarCloudPublish@3
  displayName: 'Publish Quality Gate Result'
  inputs:
    pollingTimeoutSec: '300'

# Mend Security Scan
- task: WhiteSource@21
  displayName: 'Mend Dependency Security Scan'
  inputs:
    cwd: '$(System.DefaultWorkingDirectory)'
    projectName: 'spring-petclinic-devops'

# Publish Artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifact'
  inputs:
    PathtoPublish: 'target'
    ArtifactName: 'petclinic'
    publishLocation: 'Container'